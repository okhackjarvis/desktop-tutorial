<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <title>筋トレ記録</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>筋トレ記録</h1>
    <a href="photo.html" class="photo-link">体の写真（試作）→</a>
  </header>

  <main>
    <!-- 記録 -->
    <section id="tab-log" class="tab active">
      <div class="row">
        <input type="date" id="log-date" aria-label="日付">
      </div>

      <form id="add-set-form" class="card">
        <label>種目
          <select id="exercise-select"></select>
        </label>
        <div class="row">
          <label>重量 (kg)
            <input type="number" id="weight" inputmode="decimal" step="0.5" min="0" required>
          </label>
          <label>回数
            <input type="number" id="reps" inputmode="numeric" step="1" min="1" required>
          </label>
        </div>
        <button type="submit" class="primary">セットを追加</button>
      </form>

      <div id="timer" class="card timer hidden">
        <span>休憩</span>
        <strong id="timer-display">0:00</strong>
        <button type="button" id="timer-stop">終了</button>
      </div>

      <div id="day-log"></div>
    </section>

    <!-- 履歴 -->
    <section id="tab-history" class="tab">
      <div id="history-list"></div>
    </section>

    <!-- グラフ -->
    <section id="tab-graph" class="tab">
      <label>種目
        <select id="graph-exercise"></select>
      </label>
      <div class="segmented" role="radiogroup">
        <button type="button" data-metric="max" class="on">最大重量</button>
        <button type="button" data-metric="e1rm">推定1RM</button>
        <button type="button" data-metric="volume">総挙上量</button>
      </div>
      <div id="graph" class="card"></div>
    </section>

    <!-- 設定 -->
    <section id="tab-settings" class="tab">
      <div class="card">
        <h2>種目</h2>
        <ul id="exercise-list" class="plain"></ul>
        <form id="add-exercise-form" class="row">
          <input type="text" id="new-exercise" placeholder="種目を追加" required>
          <button type="submit">追加</button>
        </form>
      </div>
      <div class="card">
        <h2>休憩タイマー</h2>
        <label>秒数
          <input type="number" id="rest-seconds" min="0" step="15">
        </label>
        <p class="hint">0 にするとタイマーを使いません。</p>
      </div>
      <div class="card">
        <h2>データ</h2>
        <p class="hint">データはこの端末のブラウザにだけ保存されます。機種変更の前にエクスポートしてください。</p>
        <div class="row">
          <button type="button" id="export">エクスポート</button>
          <label class="button">インポート
            <input type="file" id="import" accept="application/json" hidden>
          </label>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="log" class="on">記録</button>
    <button data-tab="history">履歴</button>
    <button data-tab="graph">グラフ</button>
    <button data-tab="settings">設定</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
