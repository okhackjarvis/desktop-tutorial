<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <title>体の写真 | WILL</title>
  <link rel="icon" href="icons/favicon-96.png" sizes="96x96" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;700;800;900&family=Oswald:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="photo.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <header class="topbar">
    <a href="./" class="back">← 記録へ</a>
    <h1>体の写真</h1>
  </header>

  <main>
    <div class="segmented" id="pose-select" role="radiogroup" aria-label="ポーズ">
      <button type="button" data-pose="front" class="on">正面</button>
      <button type="button" data-pose="side">横</button>
      <button type="button" data-pose="back">背中</button>
    </div>

    <!-- 撮影 -->
    <section id="shoot">
      <div class="card checklist">
        <h2>撮る前のチェック</h2>
        <ul class="plain">
          <li>朝・食事の前</li>
          <li>いつもの場所・いつもの照明</li>
          <li>スマホをいつもの高さに置く</li>
          <li>同じ服、力を抜いた姿勢</li>
        </ul>
      </div>

      <div id="viewfinder" class="viewfinder hidden">
        <video id="video" playsinline muted autoplay></video>
        <img id="ghost" class="ghost hidden" alt="">
        <div class="guides" aria-hidden="true">
          <span class="g-head"></span><span class="g-center"></span><span class="g-feet"></span>
        </div>
        <div id="countdown" class="countdown hidden"></div>
      </div>

      <div id="camera-controls" class="hidden">
        <label>前回の写真の濃さ
          <input type="range" id="ghost-opacity" min="0" max="80" value="40">
        </label>
        <div class="row">
          <label>タイマー
            <select id="timer-select">
              <option value="0">なし</option>
              <option value="3">3秒</option>
              <option value="10" selected>10秒</option>
            </select>
          </label>
          <button type="button" id="flip">カメラ切替</button>
        </div>
        <button type="button" id="shutter" class="primary">撮影</button>
      </div>

      <button type="button" id="start-camera" class="primary">カメラを起動</button>
      <label class="button file-button">カメラアプリで撮った写真を読み込む
        <input type="file" id="file-input" accept="image/*" hidden>
      </label>
      <p id="message" class="hint" role="status"></p>
    </section>

    <!-- 比較 -->
    <section class="card">
      <h2>比べる</h2>
      <div id="compare-empty" class="empty">同じポーズの写真が2枚以上になると比べられます</div>
      <div id="compare" class="hidden">
        <div class="row">
          <label>前
            <select id="before-select"></select>
          </label>
          <label>後
            <select id="after-select"></select>
          </label>
        </div>
        <div class="compare-view">
          <img id="before-img" alt="前の写真">
          <div id="after-clip" class="after-clip"><img id="after-img" alt="後の写真"></div>
          <div id="divider" class="divider"></div>
        </div>
        <input type="range" id="compare-slider" min="0" max="100" value="50" aria-label="前後の切り替え">
      </div>
    </section>

    <!-- 一覧 -->
    <section class="card">
      <h2>保存した写真</h2>
      <div id="gallery" class="gallery"></div>
      <p class="hint">写真はこのスマホの中にだけ保存され、外部には送られません。</p>
    </section>
  </main>

  <canvas id="canvas" hidden></canvas>
  <script src="photo.js"></script>
</body>
</html>
